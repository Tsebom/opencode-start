
services:
  opencode:
    # Собираем образ из Dockerfile в текущем каталоге.
    build: .

    # Имя контейнера.
    container_name: opencode-agent

    # Каталог проекта внутри контейнера.
    working_dir: /workspace

    env_file:
      - .env

    # Разрешаем интерактивный ввод и терминал.
    stdin_open: true
    tty: true

    # Подключаем только папку проекта с правами на запись.
    volumes:
      - ./project:/workspace:rw
      - opencode-home:/home/agent

    # Запрещаем запись в остальную файловую систему.
    read_only: true

    # Временный домашний каталог внутри контейнера.
    # Конфигурация и кэш исчезнут при удалении контейнера.
    tmpfs:
      #- /home/agent:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
      - /tmp:rw,exec,nosuid,size=256m,mode=1777
      - /run:rw,noexec,nosuid,size=16m

    # Удаляем все дополнительные Linux capabilities.
    cap_drop:
      - ALL

    # Запрещаем повышение привилегий через exec.
    security_opt:
      - no-new-privileges:true

    # Ограничиваем количество процессов.
    pids_limit: 256

    # Ограничиваем потребление оперативной памяти.
    mem_limit: 4g

    # Не перезапускаем контейнер автоматически.
    restart: "no"
volumes:
  opencode-home:
